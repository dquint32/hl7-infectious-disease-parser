[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hl7-infectious"
version = "2.0.0"
description = "HL7 v2.x ORU parser for infectious-disease lab results with LOINC validation"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "David Quintana" }]
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
hl7-infectious = "hl7_infectious.cli:main"

[tool.setuptools]
packages = ["hl7_infectious"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
